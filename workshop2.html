<!DOCTYPE html>
    <html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>集合研修 第2回演習（予習用）｜AIミニアプリ構築講座</title>
    <style>
    :root{--navy:#1e3a5f;--blue:#1d4ed8;--bg:#f4f6fb;--ink:#1f2937;--mut:#6b7280;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Meiryo","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.75;font-size:15px}
    header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
    header .t{font-weight:700;font-size:15px} header .s{font-size:11px;opacity:.7}
    header nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}header a{color:#fff;font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:6px}
    header a:hover{background:rgba(255,255,255,.15)}
    main{max-width:920px;margin:0 auto;padding:20px 16px 80px}
    h1{font-size:22px;color:var(--navy);margin:8px 0 4px} .lead{color:var(--mut);margin:0 0 16px}
    h2{background:var(--navy);color:#fff;font-size:17px;padding:10px 14px;border-radius:8px;margin:36px 0 12px;scroll-margin-top:70px}
    h3{font-size:15.5px;color:var(--navy);border-bottom:2px solid #3b82f6;padding-bottom:3px;margin:26px 0 10px}
    p{margin:8px 0} p.red{color:#c0392b;font-weight:700;font-size:13.5px} p.gray{color:var(--mut);font-size:13.5px} p.b{font-weight:700}
    .box{border:1.5px solid;border-radius:10px;padding:12px 16px;margin:14px 0;background:#fff}
    .box .bt{font-weight:700;color:var(--navy);margin-bottom:4px} .box .ln{margin:2px 0}
    .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    button{font-family:inherit;cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px}
    button:hover{background:#eef2ff;border-color:#6366f1} button.done{background:#dcfce7;border-color:#16a34a}
    .step{display:flex;gap:10px;margin:8px 0} .step .n{font-weight:700;color:var(--blue);min-width:2.2em} .step ul{margin:4px 0 0;padding-left:1.2em;color:var(--mut);font-size:13.5px}
    figure{margin:12px 0;text-align:center} figure img{width:100%;max-width:100%;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    figcaption{font-size:12.5px;color:var(--mut);margin-top:4px}
    .prompt{background:#f3f4f6;border:1.5px solid #6b7280;border-radius:10px;margin:14px 0;overflow:hidden}
    .prompt .ph{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#e5e7eb;font-size:12.5px;font-weight:700;color:#4b5563}
    .prompt pre{margin:0;padding:12px 16px;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:1.7}
    .prompt .hd{color:var(--blue);font-weight:700}
    .wb{margin:14px 0;border:1.5px solid #6b7280;border-radius:10px;overflow:hidden;background:#fff}
    .wb label{display:block;background:#fef3c7;color:#92400e;font-weight:700;padding:8px 14px;font-size:13.5px}
    .wb .hint{background:#fef3c7;padding:0 14px 8px;font-size:12px;color:var(--mut)}
    textarea{width:100%;border:0;padding:10px 14px;font:inherit;font-size:14px;resize:vertical;display:block;background:#fff}
    textarea:focus{outline:2px solid #6366f1}
    .tw{overflow-x:auto;margin:12px 0} table{border-collapse:collapse;width:100%;background:#fff;font-size:13.5px} th,td{border:1px solid #9ca3af;padding:7px 10px;vertical-align:top} th{background:#dbeafe;color:var(--navy);text-align:left} td.first{font-weight:700;background:#f8fafc;white-space:nowrap}
    td textarea{padding:4px 6px;font-size:13px;border:0;min-height:48px}
    .card{background:#fff;border-radius:12px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 6px rgba(0,0,0,.07)}
    .srow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed #d1d5db;flex-wrap:wrap}.srow:last-child{border:0}
    .srow .st{font-weight:700;font-size:13.5px}.srow .sa{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.srow a{font-size:12.5px}
    a.drive{font-weight:700} .toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.toc a{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;text-decoration:none;color:var(--navy);font-weight:700;font-size:13.5px}.toc a span{display:block;font-weight:400;color:var(--mut);font-size:12px}
    .btn-drive{display:inline-block;background:var(--blue);color:#fff!important;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px}
    #gate{position:fixed;inset:0;background:#0f172a;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;z-index:99;padding:20px}
    #gate a{color:#93c5fd}
    @media(max-width:600px){main{padding:14px 10px 60px}.step .n{min-width:2.6em}}
    @media print{header,.acts,button{display:none}}
    </style></head><body>
    <div id="gate"><div><h2 style="background:none">ログインが必要です</h2><p>eラーニングのトップでログインしてから、もう一度開いてください。</p><p><a href="index.html">▶ eラーニングのトップへ</a></p></div></div>
    <header><div><div class="t">AIミニアプリ構築講座</div><div class="s">集合研修　演習ページ</div></div><nav><a href="workshop.html">第1回</a><a href="workshop2.html">第2回</a><a href="index.html">← eラーニングに戻る</a></nav></header>
    <main>
<h1>集合研修　第2回演習問題</h1>
<div class="box" style="background:#FFFBEB;border-color:#F59E0B"><div class="bt">🛠 ただいま作成中です</div><div class="ln" style="">第2回（ミニアプリ構築）の演習問題は、現在作成中です。公開まで、もうしばらくお待ちください。</div><div class="ln" style="">先に<a href="workshop.html">第1回の演習問題</a>で予習を進めてください。</div></div>
</main>
    <script>
    (function(){
      try{ if(sessionStorage.getItem('loggedIn')!=='1' && !localStorage.getItem('userEmail')) document.getElementById('gate').style.display='flex'; }catch(e){}
      var SAMPLES = [];
      function copy(text, btn){
        function ok(){ if(!btn) return; var o=btn.textContent; btn.classList.add('done'); btn.textContent='✔ コピーしました'; setTimeout(function(){btn.textContent=o;btn.classList.remove('done');},1600); }
        if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(ok,function(){fb()}); } else fb();
        function fb(){ var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');ok();}catch(e){} document.body.removeChild(t); }
      }
      document.addEventListener('click',function(e){
        var b=e.target.closest('button'); if(!b) return;
        if(b.classList.contains('cp2')){ var pre=b.closest('.prompt').querySelector('pre'); copy(pre.getAttribute('data-raw'), b); }
        else if(b.classList.contains('cp') && b.dataset.sample!==undefined){ copy(SAMPLES[+b.dataset.sample].text, b); }
        else if(b.classList.contains('dl') && b.dataset.sample!==undefined){
          var s=SAMPLES[+b.dataset.sample]; var blob=new Blob(['\ufeff'+s.text],{type:'text/plain;charset=utf-8'});
          var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=s.title.replace(/[（(].*$/,'').trim()+'.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
      });
      document.querySelectorAll('textarea[data-key]').forEach(function(t){
        var k='ws2_'+t.dataset.key;
        try{ var v=localStorage.getItem(k); if(v) t.value=v; }catch(e){}
        t.addEventListener('input',function(){ try{localStorage.setItem(k,t.value);}catch(e){} });
      });
    })();
    </script></body></html>
